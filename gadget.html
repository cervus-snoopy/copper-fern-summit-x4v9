<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:1024px; height:1024px; overflow:hidden; background:#e9e9ec; font-family:'Noto Sans',sans-serif; }
  svg { display:block; width:1024px; height:1024px; }
</style></head>
<body>
<svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#efeff1"/>
      <stop offset="100%" stop-color="#d9d9de"/>
    </radialGradient>
    <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f7f8fa"/>
      <stop offset="18%" stop-color="#dfe1e5"/>
      <stop offset="45%" stop-color="#b9bdc4"/>
      <stop offset="55%" stop-color="#c6c9cf"/>
      <stop offset="80%" stop-color="#a8adb5"/>
      <stop offset="100%" stop-color="#8f949d"/>
    </linearGradient>
    <linearGradient id="chromeTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="banana" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffe45c"/>
      <stop offset="55%" stop-color="#f9c80e"/>
      <stop offset="100%" stop-color="#e8a800"/>
    </linearGradient>
    <linearGradient id="funnel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3a3d42"/>
      <stop offset="100%" stop-color="#14161a"/>
    </linearGradient>
    <radialGradient id="shadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.20"/>
      <stop offset="70%" stop-color="#000000" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <!-- studio background -->
  <rect width="1024" height="1024" fill="url(#bg)"/>

  <!-- floor shadow -->
  <ellipse cx="512" cy="772" rx="400" ry="34" fill="url(#shadow)" filter="url(#soft)"/>

  <!-- ===== BANANA: curved part entering the funnel (left) ===== -->
  <!-- dark edge under-stroke -->
  <path d="M 118 668 Q 78 566 186 522" fill="none" stroke="#c78d00" stroke-width="60" stroke-linecap="round"/>
  <path d="M 118 668 Q 78 566 186 522" fill="none" stroke="url(#banana)" stroke-width="50" stroke-linecap="round"/>
  <!-- banana tip (stem) -->
  <circle cx="118" cy="668" r="12" fill="#7a5a1e"/>
  <circle cx="118" cy="668" r="6" fill="#a97e2c"/>

  <!-- ===== BANANA: straight part exiting the slot (right) ===== -->
  <path d="M 838 522 L 962 522" fill="none" stroke="#c78d00" stroke-width="60" stroke-linecap="round"/>
  <path d="M 838 522 L 962 522" fill="none" stroke="url(#banana)" stroke-width="50" stroke-linecap="round"/>
  <!-- straight tip -->
  <circle cx="962" cy="522" r="12" fill="#7a5a1e"/>
  <circle cx="962" cy="522" r="6" fill="#a97e2c"/>

  <!-- ===== MACHINE ===== -->
  <!-- feet -->
  <rect x="268" y="612" width="34" height="26" rx="6" fill="#3c3f45"/>
  <rect x="724" y="612" width="34" height="26" rx="6" fill="#3c3f45"/>

  <!-- left funnel (intake cone) -->
  <path d="M 196 448 L 258 470 L 258 574 L 196 596 Z" fill="url(#funnel)"/>
  <ellipse cx="196" cy="522" rx="16" ry="74" fill="#0e1013"/>
  <ellipse cx="196" cy="522" rx="16" ry="74" fill="none" stroke="#e8eaed" stroke-width="5"/>
  <ellipse cx="196" cy="522" rx="9" ry="58" fill="#000000"/>

  <!-- main body -->
  <rect x="252" y="440" width="592" height="172" rx="30" fill="url(#chrome)" stroke="#878c94" stroke-width="2"/>
  <rect x="252" y="440" width="592" height="52" rx="26" fill="url(#chromeTop)"/>
  <!-- brushed lines -->
  <line x1="272" y1="470" x2="824" y2="470" stroke="#ffffff" stroke-opacity="0.35" stroke-width="2"/>
  <line x1="272" y1="590" x2="824" y2="590" stroke="#6f747c" stroke-opacity="0.5" stroke-width="2"/>

  <!-- display -->
  <rect x="560" y="466" width="132" height="62" rx="10" fill="#101418" stroke="#2c3138" stroke-width="2"/>
  <text x="626" y="500" font-size="30" font-weight="bold" fill="#4ade80" text-anchor="middle" font-family="monospace">100%</text>
  <text x="626" y="520" font-size="10" letter-spacing="1" fill="#7dd8a0" text-anchor="middle">STRAIGHTNESS</text>

  <!-- buttons -->
  <circle cx="724" cy="497" r="15" fill="#22c55e" stroke="#14532d" stroke-width="2"/>
  <circle cx="764" cy="497" r="15" fill="#ef4444" stroke="#7f1d1d" stroke-width="2"/>
  <text x="724" y="501" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">I</text>
  <text x="764" y="501" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">O</text>

  <!-- brand -->
  <text x="392" y="490" font-size="22" font-weight="bold" letter-spacing="2" fill="#3f434a" text-anchor="middle">STRAIGHT-O-MATIC</text>
  <text x="392" y="516" font-size="13" letter-spacing="4" fill="#6a6f76" text-anchor="middle">3000 · BANANA STRAIGHTENER</text>

  <!-- right slot (exit) -->
  <rect x="824" y="500" width="22" height="44" rx="8" fill="#14161a"/>
  <rect x="824" y="500" width="22" height="44" rx="8" fill="none" stroke="#e8eaed" stroke-width="3"/>

  <!-- small patent tag -->
  <text x="512" y="648" font-size="13" letter-spacing="4" fill="#8a8f96" text-anchor="middle">PATENT PENDING · MODEL B-3000</text>

  <!-- soft highlight on floor -->
  <ellipse cx="512" cy="700" rx="300" ry="16" fill="#ffffff" opacity="0.35" filter="url(#soft)"/>
</svg>
</body></html>
